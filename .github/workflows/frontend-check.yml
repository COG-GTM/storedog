name: frontend-check

on:
  pull_request:
    paths:
      - 'services/frontend/**'
      - '.github/workflows/frontend-check.yml'
  push:
    branches: [main]
    paths:
      - 'services/frontend/**'

jobs:
  cart-totals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
